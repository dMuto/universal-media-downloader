[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Os testes usam docstrings/comentários descritivos em português, com
# referências a IDs de requisitos (ex.: "14.2: ..."), que ocasionalmente
# ultrapassam o limite de linha padrão. Não vale a pena quebrar essas
# frases apenas para satisfazer o lint; o código de produção (app/)
# permanece sem essa exceção.
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
# Verificação restrita apenas ao código de produção (app/): os testes usam
# fakes/mocks dinâmicos que não compensam o esforço de tipagem completa
# neste momento. `ignore_missing_imports` evita exigir stubs para
# dependências de terceiros (yt-dlp, customtkinter) que não os fornecem.
files = ["app"]
ignore_missing_imports = true
